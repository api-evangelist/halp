name: Halp
description: >-
  Halp was a conversational ticketing and help-desk tool that let teams turn
  Slack and Microsoft Teams messages into trackable tickets, founded in Boulder,
  Colorado and backed by Techstars. Atlassian acquired Halp in February 2020 and
  folded its capabilities into Jira Service Management; the standalone Halp
  product and its API were subsequently discontinued. The halp.com domain now
  resolves to Atlassian and is served from Atlassian's edge, so no independent
  Halp developer portal, API reference, SDKs, or MCP surface remains to enrich.
  This profile records the company's history and the (Atlassian-operated)
  security posture still observable on the halp.com domain.
